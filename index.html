<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOLONG SYSTEM</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #0ff;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ===== BACKGROUND LINES ===== */
  .bg-lines { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .line {
    position: absolute;
    background: linear-gradient(90deg, transparent, #0ff, transparent);
    height: 1px; width: 100%; opacity: 0.3;
    animation: scan 3s linear infinite;
  }
  .line:nth-child(1) { top: 10%; animation-delay: 0s; }
  .line:nth-child(2) { top: 25%; animation-delay: 0.5s; }
  .line:nth-child(3) { top: 40%; animation-delay: 1s; }
  .line:nth-child(4) { top: 55%; animation-delay: 1.5s; }
  .line:nth-child(5) { top: 70%; animation-delay: 2s; }
  .line:nth-child(6) { top: 85%; animation-delay: 2.5s; }
  @keyframes scan { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  .vline {
    position: absolute; width: 1px; height: 100%;
    background: linear-gradient(180deg, transparent, #0ff, transparent);
    opacity: 0.15; animation: vscan 4s linear infinite;
  }
  .vline:nth-child(7) { left: 15%; animation-delay: 0s; }
  .vline:nth-child(8) { left: 35%; animation-delay: 1s; }
  .vline:nth-child(9) { left: 55%; animation-delay: 2s; }
  .vline:nth-child(10) { left: 75%; animation-delay: 3s; }
  @keyframes vscan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }

  /* ===== GEARS ===== */
  .gear {
    position: fixed; z-index: 0; opacity: 0.15; color: #0ff;
    font-size: 80px; animation: spin 8s linear infinite;
  }
  .gear.g1 { top: 5%; left: 5%; font-size: 100px; animation-duration: 12s; }
  .gear.g2 { bottom: 8%; right: 6%; font-size: 70px; animation-direction: reverse; }
  .gear.g3 { top: 60%; left: 3%; font-size: 50px; animation-duration: 6s; }
  .gear.g4 { top: 15%; right: 10%; font-size: 60px; animation-direction: reverse; animation-duration: 10s; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ===== SPARKS ===== */
  .spark {
    position: fixed; width: 3px; height: 3px; background: #0ff;
    border-radius: 50%; box-shadow: 0 0 8px #0ff, 0 0 16px #0ff;
    animation: float 4s linear infinite; z-index: 0; opacity: 0.6;
  }
  @keyframes float {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    10% { opacity: 1; } 90% { opacity: 1; }
    100% { transform: translateY(-10vh) translateX(50px); opacity: 0; }
  }

  /* ===== CONTAINER ===== */
  .container {
    position: relative; z-index: 10; width: 100%;
    max-width: 520px; padding: 20px;
    max-height: 95vh; overflow-y: auto;
  }
  .container::-webkit-scrollbar { width: 6px; }
  .container::-webkit-scrollbar-thumb { background: #0ff; border-radius: 3px; }
  .container::-webkit-scrollbar-track { background: rgba(0,255,255,0.05); }

  .screen { display: none; animation: fadeIn 0.5s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== BOX ===== */
  .box {
    background: rgba(0, 20, 25, 0.85);
    border: 1px solid #0ff; border-radius: 8px;
    padding: 30px 25px;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(0, 255, 255, 0.05);
    position: relative; overflow: hidden;
  }
  .box::before {
    content: ''; position: absolute; top: 0; left: -100%;
    width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, #0ff, transparent);
    animation: topLine 2s linear infinite;
  }
  @keyframes topLine { 0% { left: -100%; } 100% { left: 100%; } }

  .title {
    text-align: center; font-size: 22px; letter-spacing: 4px;
    margin-bottom: 25px; color: #0ff;
    text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

  .subtitle { text-align: center; font-size: 11px; color: #0aa; letter-spacing: 2px; margin-bottom: 20px; }

  h2.small-title {
    font-size: 14px; letter-spacing: 3px; color: #0aa;
    text-align: center; margin-bottom: 18px; text-shadow: 0 0 8px #0aa;
  }

  /* ===== INPUT ===== */
  .input-group { position: relative; margin-bottom: 20px; }
  input[type="text"] {
    width: 100%; padding: 14px 16px;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid #0ff; border-radius: 6px;
    color: #0ff; font-family: 'Courier New', monospace;
    font-size: 14px; letter-spacing: 2px; outline: none; transition: all 0.3s;
  }
  input[type="text"]:focus { box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); }
  input::placeholder { color: #055; letter-spacing: 1px; }

  /* ===== BUTTON ===== */
  .btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(0, 255, 255, 0.25));
    border: 1px solid #0ff; border-radius: 6px;
    color: #0ff; font-family: 'Courier New', monospace;
    font-size: 15px; letter-spacing: 3px; cursor: pointer;
    transition: all 0.3s; text-shadow: 0 0 8px #0ff;
    position: relative; overflow: hidden;
  }
  .btn:hover {
    background: linear-gradient(135deg, rgba(0, 255, 255, 0.25), rgba(0, 255, 255, 0.45));
    box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
    transform: translateY(-2px);
  }
  .btn:active { transform: translateY(0); }

  /* ===== OPTIONS ===== */
  .options {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 15px; margin-top: 10px;
  }
  .opt-btn {
    padding: 30px 10px;
    background: rgba(0, 30, 35, 0.7);
    border: 1px solid #0ff; border-radius: 8px;
    color: #0ff; font-family: 'Courier New', monospace;
    font-size: 15px; letter-spacing: 2px; cursor: pointer;
    transition: all 0.3s; text-shadow: 0 0 8px #0ff;
    position: relative; overflow: hidden;
  }
  .opt-btn::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(45deg, transparent 30%, rgba(0,255,255,0.15) 50%, transparent 70%);
    transform: translateX(-100%); transition: transform 0.5s;
  }
  .opt-btn:hover::after { transform: translateX(100%); }
  .opt-btn:hover {
    background: rgba(0, 60, 70, 0.8);
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
    transform: scale(1.03);
  }

  /* ===== LOADING ===== */
  .loader-box { text-align: center; padding: 40px 25px; }
  .circle-wrap { width: 160px; height: 160px; margin: 0 auto 25px; position: relative; }
  .circle-wrap svg { transform: rotate(-90deg); }
  .circle-bg { fill: none; stroke: rgba(0, 255, 255, 0.15); stroke-width: 6; }
  .circle-progress {
    fill: none; stroke: #0ff; stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: 440; stroke-dashoffset: 440;
    filter: drop-shadow(0 0 6px #0ff);
    transition: stroke-dashoffset 0.1s linear;
  }
  .percent {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px; color: #0ff;
    text-shadow: 0 0 15px #0ff; font-weight: bold;
  }
  .loading-text {
    color: #0aa; font-size: 12px; letter-spacing: 3px;
    animation: pulse 1.5s ease-in-out infinite;
  }

  /* ===== OFFSET PANEL ===== */
  .offset-panel {
    margin-top: 20px;
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid #0ff; border-radius: 6px;
    padding: 15px; font-size: 11px; line-height: 1.7;
    max-height: 420px; overflow-y: auto;
    box-shadow: inset 0 0 15px rgba(0, 255, 255, 0.1);
  }
  .offset-panel::-webkit-scrollbar { width: 6px; }
  .offset-panel::-webkit-scrollbar-thumb { background: #0ff; border-radius: 3px; }
  .offset-panel::-webkit-scrollbar-track { background: rgba(0,255,255,0.05); }

  .offset-row {
    padding: 8px 0;
    border-bottom: 1px dashed rgba(0, 255, 255, 0.15);
  }
  .offset-row:last-child { border-bottom: none; }

  .offset-addr { color: #fa0; text-shadow: 0 0 5px #fa0; font-weight: bold; }
  .offset-hex { color: #0ff; text-shadow: 0 0 5px #0ff; word-break: break-all; display: block; margin-top: 3px; }
  .offset-hex.orig { color: #0aa; }
  .offset-hex.patch { color: #0f8; }

  .hex-label { color: #0aa; font-size: 10px; letter-spacing: 1px; }

  .back-btn {
    margin-top: 18px; width: 100%; padding: 12px;
    background: transparent; border: 1px solid #0aa; border-radius: 6px;
    color: #0aa; font-family: 'Courier New', monospace;
    font-size: 13px; letter-spacing: 2px; cursor: pointer; transition: all 0.3s;
  }
  .back-btn:hover {
    color: #0ff; border-color: #0ff;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
  }

  .telegram {
    position: fixed; bottom: 15px; right: 15px; z-index: 20;
    color: #0ff; font-size: 12px; letter-spacing: 1px;
    text-decoration: none; padding: 8px 14px;
    border: 1px solid #0ff; border-radius: 20px;
    background: rgba(0, 20, 25, 0.9);
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    transition: all 0.3s;
  }
  .telegram:hover {
    background: rgba(0, 255, 255, 0.15);
    box-shadow: 0 0 25px rgba(0, 255, 255, 0.7);
  }

  .error {
    color: #f55; text-align: center; font-size: 12px;
    margin-top: 10px; letter-spacing: 1px;
    text-shadow: 0 0 8px #f55; animation: shake 0.4s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .warning {
    text-align: center; color: #fa0; font-size: 13px;
    letter-spacing: 2px; padding: 40px 20px;
    text-shadow: 0 0 10px #fa0;
    animation: pulse 1.5s infinite;
  }

  .copy-btn {
    margin-top: 10px; width: 100%; padding: 10px;
    background: rgba(0, 255, 255, 0.1);
    border: 1px solid #0aa; border-radius: 6px;
    color: #0aa; font-family: 'Courier New', monospace;
    font-size: 12px; letter-spacing: 2px; cursor: pointer;
    transition: all 0.3s;
  }
  .copy-btn:hover {
    background: rgba(0, 255, 255, 0.25);
    color: #0ff; border-color: #0ff;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
  }
</style>
</head>

  function renderRows(name, data) {
    let html = '';
    data.forEach(row => {
      html += `<div class="offset-row">`;
      html += `<span class="offset-addr">${row.addr}</span>`;
      if (row.orig && row.patch) {
        html += `<span class="offset-hex orig"><span class="hex-label">GỐC:</span> ${row.orig}</span>`;
        html += `<span class="offset-hex patch"><span class="hex-label">SỬA:</span> ${row.patch}</span>`;
      } else {
        html += `<span class="offset-hex"><span class="hex-label">HEX:</span> ${row.hex}</span>`;
      }
      html += `</div>`;
    });
    return html;
  }

  function showOffset(group, name) {
    const targetId = group === 'CACHE' ? 'cacheOffsetDisplay' : 'avatarOffsetDisplay';
    const panel = document.getElementById(targetId);

    if (panel.dataset.current === name) {
      panel.innerHTML = '';
      panel.dataset.current = '';
      return;
    }

    const data = DATA[name] || [];
    let html = `<div class="offset-panel">
      <div style="text-align:center;color:#0ff;margin-bottom:10px;letter-spacing:2px;font-size:13px;">▸ ${name} ◂</div>`;
    html += renderRows(name, data);
    html += `</div>`;
    html += `<button class="copy-btn" onclick="copyOffset('${name}')">📋 COPY OFFSET</button>`;
    panel.innerHTML = html;
    panel.dataset.current = name;
  }

  function copyOffset(name) {
    const data = DATA[name] || [];
    let text = `=== ${name} ===\n`;
    data.forEach(row => {
      if (row.orig && row.patch) {
        text += `${row.addr}  ${row.orig}  ->  ${row.patch}\n`;
      } else {
        text += `${row.addr}  ${row.hex}\n`;
      }
    });
    navigator.clipboard.writeText(text).then(() => {
      const btns = document.querySelectorAll('.copy-btn');
      btns.forEach(b => { if (b.textContent.includes('COPY')) { 
        const orig = b.textContent; b.textContent = '✅ ĐÃ COPY!'; 
        setTimeout(()=>b.textContent = orig, 1200); 
      }});
    });
  }

  function chamsWarning(name) {
    const panel = document.getElementById('chamsDisplay');
    panel.innerHTML = `<div class="warning">⚠ ${name} — CHƯA CÓ OFFSET ⚠</div>`;
  }
